<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Riffdle "Liner Notes" mark: four stem bars (drums / bass / melody / vocals) -->
  <rect width="100" height="100" fill="#1a1713"/>
  <!-- bars share a baseline at y=76, echoing the stem reveal / loading equalizer -->
  <rect x="15" y="30" width="11" height="46" fill="#e03e1a"/>
  <rect x="35" y="14" width="11" height="62" fill="#2456c4"/>
  <rect x="55" y="42" width="11" height="34" fill="#c89104"/>
  <rect x="75" y="22" width="11" height="54" fill="#2e7d52"/>
</svg>
