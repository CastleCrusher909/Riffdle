<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9d5cff"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <!-- Guitar body (figure-8 shape) -->
  <ellipse cx="50" cy="72" rx="22" ry="20" fill="url(#g)"/>
  <ellipse cx="50" cy="50" rx="16" ry="15" fill="url(#g)"/>
  <!-- Waist cutout illusion via body overlap -->
  <rect x="38" y="54" width="24" height="12" fill="url(#g)"/>
  <!-- Neck -->
  <rect x="46" y="10" width="8" height="36" rx="3" fill="url(#g)"/>
  <!-- Headstock -->
  <rect x="42" y="5" width="16" height="10" rx="3" fill="url(#g)"/>
  <!-- Tuning pegs left -->
  <circle cx="42" cy="8" r="2.5" fill="url(#g)"/>
  <circle cx="42" cy="13" r="2.5" fill="url(#g)"/>
  <!-- Tuning pegs right -->
  <circle cx="58" cy="8" r="2.5" fill="url(#g)"/>
  <circle cx="58" cy="13" r="2.5" fill="url(#g)"/>
  <!-- Sound hole -->
  <circle cx="50" cy="68" r="5" fill="#0d0d14" opacity="0.4"/>
  <!-- Strings -->
  <line x1="48" y1="10" x2="48" y2="72" stroke="#0d0d14" stroke-width="0.6" opacity="0.3"/>
  <line x1="50" y1="10" x2="50" y2="72" stroke="#0d0d14" stroke-width="0.6" opacity="0.3"/>
  <line x1="52" y1="10" x2="52" y2="72" stroke="#0d0d14" stroke-width="0.6" opacity="0.3"/>
</svg>
